# ZeroClaw — HONE Marketing Drafter
# Routes inference through the HONE chain (POST /v1/chat/completions → miners)
# api_key is injected at runtime from hone .env by draft.sh

workspace_dir       = "/home/ubuntclaw/repos/hone/marketing-dashboard/zeroclaw/drafter/workspace"
default_provider    = "openai"
default_model       = "qwen3.5:9b"
api_key             = "HONE_API_KEY_HERE"
api_url             = "http://localhost:4242"
default_temperature = 0.85
provider_timeout_secs = 300

[agent]
max_tool_iterations  = 20
max_history_messages = 30
max_context_tokens   = 16000

[memory]
backend = "none"

[tools.http_request]
enabled           = true
allowed_domains   = ["localhost:7979"]
max_response_size = 524288
timeout_secs      = 15
