[project]
name = "hone-mcp"
version = "0.1.0"
description = "MCP server exposing a hone-node's local HTTP API as tools for agentic install/onboarding/operation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # server.py imports mcp.server.mcpserver.MCPServer, which only exists from
    # mcp 2.x onward (mcp 1.x's equivalent was mcp.server.fastmcp.FastMCP,
    # renamed in the 2.0 migration). Pin >=2.0.0 so this doesn't silently
    # ImportError on an older install.
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.scripts]
hone-mcp = "hone_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hone_mcp"]
