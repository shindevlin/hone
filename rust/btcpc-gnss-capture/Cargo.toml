[package]
name = "btcpc-gnss-capture"
version = "0.1.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]

[[bin]]
name = "btcpc-gnss-capture"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
base64 = "0.22"
urlencoding = "2"
anyhow = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"
