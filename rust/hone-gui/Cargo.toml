[package]
name = "hone-gui"
version = "0.1.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]
description = "HONE native desktop GUI"

[[bin]]
name = "hone-gui"
path = "src/main.rs"


# Standalone crate — not a member of rust/Cargo.toml workspace.
[workspace]
[dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.34"
egui_tiles = { version = "0.15", features = ["serde"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
glow = "0.17"
hone-sdk = { path = "../hone-sdk" }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
