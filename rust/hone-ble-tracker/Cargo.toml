[package]
name = "hone-ble-tracker"
version = "1.0.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]
description = "HONE BLE tracker scanner — passive detection of AirTags, Find My Device tags, Tile, Samsung SmartTags, with acoustic ownership challenge"

[[bin]]
name = "hone-ble-tracker"
path = "src/main.rs"

[features]
default = []
# Enable acoustic challenge listener (requires ALSA/PulseAudio + USB microphone).
acoustic = ["dep:cpal", "dep:rustfft"]


# Standalone crate — not a member of rust/Cargo.toml workspace.
[workspace]
[dependencies]
# BLE passive scanning
btleplug = "0.11"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }

# Audio FFT — optional, for acoustic ownership challenge
cpal  = { version = "0.15", optional = true }
rustfft = { version = "6", optional = true }

# Async
tokio = { version = "1", features = ["full"] }

# Crypto / hashing
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# HTTP client (submit to local hone-node)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Local sighting log (co-location tracking)
sled = "0.34"

# HTTP API (acoustic challenge server)
axum = { version = "0.7", features = ["json"] }

# CLI / config
clap = { version = "4", features = ["derive", "env"] }

# Utilities
anyhow  = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono  = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 2
strip = true
