[package]
name = "btcpc-p2p"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "BTCPC P2P sidecar — libp2p Kademlia DHT peer discovery"

[[bin]]
name = "btcpc-p2p"
path = "src/main.rs"

[dependencies]
btcpc-types = { path = "../btcpc-node/crates/btcpc-types" }
libp2p = { version = "0.56", features = [
    "tcp", "quic", "noise", "yamux",
    "gossipsub", "kad", "identify", "ping", "macros", "tokio",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
anyhow = "1"
hex = "0.4"
dirs-next = "2"
rand = "0.8"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
