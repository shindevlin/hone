[package]
name = "btcpc-orchestrator"
version = "0.1.0"
edition = "2021"
authors = ["BTCPC contributors"]
description = "Rust-native BTCPC runtime and agent orchestration model"
license = "MIT OR Apache-2.0"

[lib]
name = "btcpc_orchestrator"
path = "src/lib.rs"

[[bin]]
name = "btcpc-orchestratord"
path = "src/main.rs"

[dependencies]
btcpc-api-catalog = { path = "../btcpc-api-catalog" }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
