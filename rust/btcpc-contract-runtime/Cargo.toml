[package]
name = "btcpc-contract-runtime"
version = "1.0.0"
edition = "2021"
description = "WASM execution runtime for BTCPC smart contracts — runs inside btcpc-p2p sidecar"
authors = ["Shin Devlin <shindevlin@proton.me>"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "btcpc-contract-runtime"
path = "src/main.rs"

[lib]
name = "btcpc_contract_runtime"
path = "src/lib.rs"

[dependencies]
wasmtime = { version = "23" }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
