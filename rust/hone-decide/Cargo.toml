[package]
name = "hone-decide"
version = "0.1.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]
license = "MIT OR Apache-2.0"
description = "Small Rust-native decision engine for HONE: calibrated candidate probabilities (a reimplementation of Open-Jev's scoring design)"

[[bin]]
name = "hone-decide"
path = "src/main.rs"

[dependencies]
candle-core = { version = "0.10", default-features = false }
candle-nn = { version = "0.10", default-features = false }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rayon = "1"
tiny_http = "0.12"
sha2 = "0.10"

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
