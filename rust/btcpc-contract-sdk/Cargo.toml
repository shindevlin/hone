[workspace]
members = [
    "sdk",
    "sdk-macros",
    "examples/ft",
    "examples/nft",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/btcpc-network/btcpc-contract-sdk"

[workspace.dependencies]
btcpc-contract-sdk = { path = "sdk" }
btcpc-contract-sdk-macros = { path = "sdk-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
