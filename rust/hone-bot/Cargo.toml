[package]
name = "hone-bot"
version = "1.0.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]
description = "HONE Telegram bot"


# Standalone crate — not a member of rust/Cargo.toml workspace.
[workspace]
[dependencies]
teloxide = { version = "0.13", features = ["macros"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
