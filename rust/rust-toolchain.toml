# Pinned toolchain for reproducible builds.
#
# 1.99.1 (2026-11): the hone-node ICE that pinned us to 1.90.0 (rustc 1.93 and
# 1.95 crashed in check_mod_deathness / resolver_for_lowering_raw on the `api`
# module) does not reproduce on 1.99.1: `cargo check -p hone-node` and
# `cargo test --workspace` pass. Newer dependencies need it anyway:
# alloy 2 needs 1.91, egui/eframe 0.34 need 1.92, candle 0.11 needs a rustc
# where core::arch::x86_64::__cpuid_count is safe (not 1.90).
#
# See docs/PLAN_FABLE5_STABILIZATION.md Phase 0 for the old diagnosis.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
