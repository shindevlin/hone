[package]
name = "btcpc-sdk"
version = "1.0.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]
description = "BTCPC chain client SDK"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
# Wallet / BIP39+BIP44+SLIP10 multi-chain key derivation
bip39 = { version = "2", features = ["rand"] }
k256 = { version = "0.13", features = ["arithmetic", "ecdsa"] }
sha3 = "0.10"
sha2 = "0.10"
hmac = "0.12"
bs58 = "0.5"
