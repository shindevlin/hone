[workspace]
resolver = "2"

[package]
name = "btcpc-android"
version = "1.0.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]

[lib]
name = "btcpc_miner"
crate-type = ["cdylib"]

[dependencies]
btcpc-types = { path = "../btcpc-node/crates/btcpc-types" }

# JNI bridge
jni = { version = "0.21", default-features = false }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Inference — candle CPU backend for on-device GGUF models
candle-core = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false, features = ["quantized"] }
candle-nn = { version = "0.8", default-features = false }
tokenizers = { version = "0.20", default-features = false, features = ["http"] }
hf-hub = { version = "0.3", default-features = false, features = ["tokio"] }

# Crypto
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
secp256k1 = { version = "0.29", features = ["recovery"] }
bs58 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-android = "0.2"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
