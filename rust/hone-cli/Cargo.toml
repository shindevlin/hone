[package]
name = "hone-cli"
version = "1.2.2"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]
description = "HONE chain CLI"

[[bin]]
name = "hone"
path = "src/main.rs"


# Standalone crate — not a member of rust/Cargo.toml workspace.
[workspace]
[dependencies]
clap = { version = "4", features = ["derive", "env"] }
# rustls, not OpenSSL: cross-compiling to aarch64 (release-node.yml) has no target OpenSSL.
# Same choice as hone-node. charset/http2 kept from reqwest's defaults.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "charset", "http2"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
tabled = "0.15"
base64 = "0.22"
hone-sdk = { path = "../hone-sdk" }
hone-provision = { path = "../hone-provision" }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
dirs-next = "2"
rpassword = "7"
