[package]
name = "hone-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "HONE sovereign chain node — networking, consensus, state, API"

[[bin]]
name = "hone-node"
path = "src/main.rs"

[dependencies]
hone-types = { path = "crates/hone-types" }
hone-contract-runtime = { path = "../hone-contract-runtime" }
wasmtime = { version = "23" }
# Async
tokio = { version = "1", features = ["full"] }

# State
rocksdb = { version = "0.22", default-features = false }

# API
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }

# Crypto
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
flate2 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
secp256k1 = { version = "0.29", features = ["recovery"] }
bs58 = "0.5"
bip39 = "2"
hmac = "0.12"
aes-gcm = "0.10"
sha3 = "0.10"
ripemd = "0.1"
bech32 = "0.9"
blake2 = "0.10"
everscale-types = { version = "0.1", default-features = false, features = ["sync"] }

# Networking
libp2p = { version = "0.56", features = [
    "tcp", "quic", "noise", "yamux", "websocket", "dns",
    "gossipsub", "kad", "identify", "ping", "macros", "tokio", "mdns",
] }
# Optional: Matrix alt-transport (Phase-5 transport cascade). Off by default —
# matrix-sdk 0.17 forces rustc >=1.93, which currently triggers a rustc ICE on
# this codebase (see docs/PLAN_FABLE5_STABILIZATION.md Phase 0). Gating it lets
# core hone-node build/test on a toolchain that avoids the ICE. Enable with
# `--features matrix` once the toolchain issue is resolved.
matrix-sdk = { version = "0.17", default-features = false, features = ["markdown"], optional = true }
nostr-sdk = { version = "0.37" }
rustls = { version = "0.23", features = ["ring"], default-features = false }

# HTTP client (peer discovery — Hive + TON registry queries; streaming for agent chat)
# Use rustls so cross-compilation (ARM64/Pi) works without system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Force vendored OpenSSL. hone-node's own reqwest uses rustls above, but `hf-hub`
# (Hugging Face client, pulled in by the `inference-embedded` default feature) drags
# in an independent old reqwest 0.11 -> native-tls -> openssl-sys. Vendoring keeps
# that build from depending on a system OpenSSL, which matters for cross-compiling to
# aarch64 (Grouchly's Nebra) and Android NDK targets that don't reliably have one.
# Do not remove without first patching hf-hub off native-tls — see the openssl
# dependency investigation (2026-07-07) for the full trace.
openssl = { version = "0.10", features = ["vendored"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Utilities
urlencoding = "2"
anyhow = "1"
socket2 = { version = "0.5", features = ["all"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs-next = "2"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"

# Embedded inference — candle GGUF, in-process (no external Ollama daemon).
# Versions pinned to match the proven hone-android/src/llm.rs stack.
# Optional + behind the `inference-embedded` feature so non-inference nodes stay
# lean and the candle build weight is opt-in. See docs/INFERENCE_EMBED_SPEC.md.
candle-core = { version = "0.10", default-features = false, optional = true }
candle-transformers = { version = "0.10", default-features = false, optional = true }
candle-nn = { version = "0.10", default-features = false, optional = true }
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }
hf-hub = { version = "0.3", default-features = false, features = ["tokio", "online"], optional = true }

[features]
# `matrix` enables the optional Matrix alt-transport (pulls matrix-sdk, which
# forces rustc >=1.93). Off by default so core builds on a lower toolchain that
# avoids the current rustc ICE. See docs/PLAN_FABLE5_STABILIZATION.md Phase 0.
#
# `inference-embedded` enables the in-process candle GGUF backend. ON by default
# so a node serves inference without any external daemon (the non-fragile path).
# Turn it off (--no-default-features) for a lean node that only relays or points
# at an external INFERENCE_URL (e.g. a vLLM GPU node).
default = ["inference-embedded"]
matrix = ["dep:matrix-sdk"]
inference-embedded = ["dep:candle-core", "dep:candle-transformers", "dep:candle-nn", "dep:tokenizers", "dep:hf-hub"]

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[target.'cfg(unix)'.dependencies]
libc = "0.2"
