[package]
name = "btcpc-wallet-create"
version = "0.1.0"
edition = "2021"
authors = ["BTCPC contributors"]
description = "Standalone BTCPC wallet and account creation app"

[[bin]]
name = "btcpc-wallet-create"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.34"
anyhow = "1"
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
btcpc-sdk = { path = "../btcpc-sdk" }
