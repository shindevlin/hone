[package]
name = "hone-tui"
version = "0.1.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]
description = "HONE terminal UI"

[[bin]]
name = "hone-tui"
path = "src/main.rs"


# Standalone crate — not a member of rust/Cargo.toml workspace.
[workspace]
[dependencies]
ratatui = "0.28"
crossterm = "0.28"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
hone-sdk = { path = "../hone-sdk" }
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
