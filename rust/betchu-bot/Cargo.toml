[package]
name = "betchu-bot"
version = "1.0.0"
edition = "2021"
authors = ["natoshisakamoto"]
description = "BTCPC-compliant P2P sports betting Telegram bot"

[dependencies]
# Telegram bot framework
teloxide = { version = "0.13", features = ["macros"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server — BTCPC service compliance (health endpoint + heartbeat receiver)
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }

# HTTP client — ESPN, BTCPC inference, EVM RPC
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# EVM / Base Sepolia contract interaction
alloy = { version = "2.0", features = ["essentials", "sol-types", "json-abi", "network", "rpc-types"] }

# MongoDB
mongodb = { version = "3", features = ["dns-resolver"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Env loading (.envbtcpc + .env)
dotenvy = "0.15"

# Time & scheduling
chrono = { version = "0.4", features = ["serde"] }
tokio-cron-scheduler = "0.13"

# Ed25519 signing for BTCPC transactions
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"

# Misc utilities
uuid = { version = "1", features = ["v4"] }
regex = "1"
once_cell = "1"
parking_lot = "0.12"

[[bin]]
name = "betchu-bot"
path = "src/main.rs"
