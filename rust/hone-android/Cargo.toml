[workspace]
resolver = "2"

[package]
name = "hone-android"
version = "1.0.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]

[lib]
name = "hone_miner"
# cdylib: the .so loaded by Android. staticlib + lib: needed by uniffi's
# bindgen + for host-target compile-checking the bridge without the NDK.
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
hone-types = { path = "../hone-node/crates/hone-types" }

# uniffi — typed, auto-generated Kotlin bindings (replaces hand-written JNI).
# See docs/ANDROID_WORLDCLASS_PLAN.md §3. The proc-macro path (#[uniffi::export])
# means no external .udl file — the Rust source IS the interface definition.
uniffi = { version = "0.28", features = ["cli"] }

# JNI bridge — RETAINED transitionally. The uniffi path (bridge.rs) is the new
# surface; the legacy JNI in lib.rs stays compilable until the Kotlin app is on
# uniffi, then it is deleted. No live consumer depends on the JNI today (the
# shipping webview APK calls the server HTTP API, not this .so).
jni = { version = "0.21", default-features = false }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "io-util"] }

# P2P — TCP only (no QUIC; Android restricts raw UDP on some kernels)
libp2p = { version = "0.56", features = [
    "tcp", "noise", "yamux",
    "gossipsub", "kad", "identify", "ping", "macros", "tokio", "mdns",
] }

# Embedded state store — pure Rust, no C++ build deps
sled = "0.34"

# Inference — candle CPU backend for on-device GGUF models
candle-core = { version = "0.10", default-features = false }
candle-transformers = { version = "0.10", default-features = false }
candle-nn = { version = "0.10", default-features = false }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
hf-hub = { version = "0.3", default-features = false, features = ["tokio", "online"] }
# Vendored: hf-hub's "online" feature pulls an independent reqwest 0.11 -> native-tls
# -> openssl-sys. Vendoring avoids depending on a system OpenSSL, essential here since
# Android NDK targets have none. Do not remove without patching hf-hub off native-tls.
openssl = { version = "0.10", features = ["vendored"] }

# Crypto
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
secp256k1 = { version = "0.29", features = ["recovery"] }
bs58 = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }

# HTTP client — discovery (Hive peer fetch) + HF Hub model download
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Utilities
futures = "0.3"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-android = "0.2"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
# Generates the uniffi scaffolding at build time from the #[uniffi::export] macros.
uniffi = { version = "0.28", features = ["build"] }

# uniffi-bindgen binary target — `cargo run --bin uniffi-bindgen generate ...`
# emits the Kotlin bindings for the Android module. Kept in-crate so the binding
# generator version always matches the runtime version.
[[bin]]
name = "uniffi-bindgen"
path = "src/uniffi_bindgen.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
