[workspace]
members = [".", "crates/btcpc-types"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]
license = "MIT OR Apache-2.0"

[package]
name = "btcpc-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "BTCPC sovereign chain node — networking, consensus, state, API"

[[bin]]
name = "btcpc-node"
path = "src/main.rs"

[dependencies]
btcpc-types = { path = "crates/btcpc-types" }
btcpc-contract-runtime = { path = "../btcpc-contract-runtime" }
wasmtime = { version = "23" }
# Async
tokio = { version = "1", features = ["full"] }

# State
rocksdb = { version = "0.22", default-features = false }

# API
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }

# Crypto
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
secp256k1 = { version = "0.29", features = ["recovery"] }
bs58 = "0.5"
bip39 = "2"
hmac = "0.12"
sha3 = "0.10"
ripemd = "0.1"
bech32 = "0.9"
blake2 = "0.10"

# Networking
libp2p = { version = "0.56", features = [
    "tcp", "quic", "noise", "yamux", "websocket", "dns",
    "gossipsub", "kad", "identify", "ping", "macros", "tokio", "mdns",
] }

# HTTP client (peer discovery — Hive + TON registry queries; streaming for agent chat)
# Use rustls so cross-compilation (ARM64/Pi) works without system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Force vendored OpenSSL for any crates (wasmtime, libp2p transports) that still pull it in.
openssl = { version = "0.10", features = ["vendored"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs-next = "2"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[target.'cfg(unix)'.dependencies]
libc = "0.2"
