[package]
name = "hone-contract-sdk"
description = "HONE smart contract SDK — write contracts in Rust, deploy as WASM"
keywords = ["hone", "smart-contracts", "blockchain", "wasm"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hone-contract-sdk-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
borsh = { workspace = true }
wee_alloc = { version = "0.4", optional = true }

[features]
default = ["wee_alloc"]
