[package]
name = "hone-contract-sdk"
description = "HONE smart contract SDK — write contracts in Rust, deploy as WASM"
keywords = ["hone", "smart-contracts", "blockchain", "wasm"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hone-contract-sdk-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
borsh = { workspace = true }
# dlmalloc is the allocator Rust std uses on wasm32; wee_alloc is unmaintained (RUSTSEC-2022-0054).
dlmalloc = { version = "0.2", features = ["global"], optional = true }

[features]
default = ["dlmalloc"]
