[package]
name = "hone-settlement-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "HONE USD -> HONE settlement bridge — crash-safe worker that posts SensorDataPurchase on-chain for USD-paid Verasens queries"

[[bin]]
name = "hone-settlement-bridge"
path = "src/main.rs"

[lib]
name = "hone_settlement_bridge"
path = "src/lib.rs"

[dependencies]
hone-types = { path = "../hone-node/crates/hone-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
