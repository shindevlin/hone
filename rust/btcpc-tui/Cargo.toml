[package]
name = "btcpc-tui"
version = "0.1.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]
description = "BTCPC terminal UI"

[[bin]]
name = "btcpc-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
btcpc-sdk = { path = "../btcpc-sdk" }
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
