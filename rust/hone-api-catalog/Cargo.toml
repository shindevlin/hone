[package]
name = "hone-api-catalog"
version = "0.1.0"
edition = "2021"
authors = ["HONE contributors"]
description = "HONE public API catalog parser, snapshotter, and link verifier"
license = "MIT OR Apache-2.0"

[lib]
name = "hone_api_catalog"
path = "src/lib.rs"

[[bin]]
name = "hone-api-catalog"
path = "src/main.rs"

[features]
default = ["verify"]
verify = ["dep:reqwest"]


# Standalone crate — not a member of rust/Cargo.toml workspace.
[workspace]
[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
