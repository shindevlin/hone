[package]
name = "btcpc-cli"
version = "1.0.0"
edition = "2021"
authors = ["Shin Devlin <shindevlin@proton.me>"]
description = "BTCPC chain CLI"

[[bin]]
name = "btcpc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
tabled = "0.15"
base64 = "0.22"
