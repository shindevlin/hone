<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join HONE</title>
<meta name="description" content="Your camera can hear birds you've never seen.">
<meta property="og:title" content="Your camera can hear birds you've never seen.">
<meta property="og:image" content="https://honemesh.net/assets/join-kiskadee.jpg">
<!--
  ===== COPY: edit the wording here (JSON). {referrer} is filled from ?ref= =====
  The page picks a flow by device: Android (the app), iPhone (listener on a computer at home,
  birds at /me), desktop (listener download cards from /assets/listener-install.js).
  No crypto or wallet words on this page apart from the single "full HONE" link.
-->
<script id="copy" type="application/json">
{
  "headline": "Your camera can hear birds you've never seen.",
  "intro": "HONE turns your phone, or the security camera you already have, into a nature listener. It recognizes almost 15,000 species of birds, frogs and insects by sound, and puts what it hears on a live map shared with people around the world.",
  "what_title": "What you get",
  "what": [
    ["list", "A list of every species living around your home, with photos and their real calls."],
    ["map", "Your spot on the world map: see what's singing near you and far away."],
    ["lock", "Private by design. Human conversation is automatically deleted the moment it's heard. No audio is ever saved or sent, only the bird's name and the time."],
    ["gift", "Free, with no ads and no subscription."]
  ],
  "setup_title": "Setup takes 2 minutes",
  "setup": ["Install the app", "Sign in with your email", "Tap \"Add a camera\" and pick yours"],
  "button": "Install HONE",
  "open_app": "Already installed? Open HONE",
  "code_hint": "Or type this invite code in the app:",
  "howto_title": "How to allow the install",
  "howto": [
    "Tap Install HONE. If Chrome asks, tap Download anyway, then Open.",
    "Android says it can't install apps from this source: tap Settings, turn on Allow from this source, then go back.",
    "Tap Install, then Open. That's it."
  ],
  "small_ref": "Invited by {referrer}, who gets the credit for your finds for now.",
  "small_pool": "Your finds help fund bird contests for the whole HONE community.",
  "ios_title": "On an iPhone?",
  "ios_text": "Your camera listens from a computer at home. Set it up on a computer that stays on, then check your birds here.",
  "ios_email": "Email me the setup link",
  "ios_email_subject": "Set up my HONE camera listener",
  "ios_email_body": "Open this on a computer that stays on at home:\n{link}\n\nThen check your birds on your iPhone at https://honemesh.net/me",
  "ios_me": "Check my birds at honemesh.net/me",
  "ios_tip": "Tip: open honemesh.net/me in Safari, tap Share, then Add to Home Screen.",
  "desk_title": "Set up the listener on this computer",
  "desk_text": "Leave this computer on and it listens through your security camera, day and night. Your birds show up on your phone at honemesh.net/me.",
  "desk_more": "Other computers, Raspberry Pi and help",
  "desk_android": "Have an Android phone? It can listen too:",
  "disclaimer": "Human conversation is automatically deleted. The listener only keeps a count of voices it removed. No audio is ever saved or sent; only a short bird report every 15 minutes.",
  "full": "Get paid for your birds → full HONE",
  "photo_credit": "Great kiskadee. Photo: Rhododendrites, CC BY-SA 4.0, via Wikimedia Commons"
}
</script>
<style>
:root{--bg:#0a0e17;--surface:#121826;--hi:#1b2233;--line:#2a3346;--text:#e8ecf4;--dim:#aeb6c6;--faint:#6b7488;--accent:#f7931a;--green:#3ddc84}
:root[data-theme="light"]{--bg:#f6f4ef;--surface:#fff;--hi:#f0ede6;--line:#e2ddd3;--text:#1d2230;--dim:#4a5163;--faint:#7b8294;--accent:#c96f00;--green:#1b8f4e}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f4ef;--surface:#fff;--hi:#f0ede6;--line:#e2ddd3;--text:#1d2230;--dim:#4a5163;--faint:#7b8294;--accent:#c96f00;--green:#1b8f4e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
.hero{position:relative;margin:0 -16px;aspect-ratio:4/3;overflow:hidden;background:var(--hi)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,var(--bg))}
.credit{font-size:11px;color:var(--faint);margin:6px 0 0;text-align:right}
.credit a{color:inherit}
.brand{position:absolute;top:14px;left:16px;z-index:1;font-weight:800;letter-spacing:.08em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
h1{font-size:30px;line-height:1.15;margin:4px 0 12px;letter-spacing:-.01em}
p.intro{color:var(--dim);margin:0 0 24px;font-size:17px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:28px 0 12px}
.what{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.what li{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.what svg{flex:none;width:26px;height:26px;color:var(--accent);margin-top:1px}
ol.setup{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}
ol.setup li{counter-increment:s;display:flex;gap:12px;align-items:center}
ol.setup li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--hi);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.cta{display:block;text-align:center;background:var(--accent);color:#000;font-weight:800;font-size:19px;text-decoration:none;border-radius:16px;padding:18px;margin:28px 0 10px}
.cta:active{transform:scale(.99)}
.cta.alt{background:var(--surface);color:var(--text);border:1px solid var(--line);font-size:17px;padding:15px}
.sub{display:block;text-align:center;color:var(--accent);margin:0 0 6px}
.code{text-align:center;color:var(--dim);font-size:14px}
.code b{font-family:ui-monospace,monospace;color:var(--text);background:var(--hi);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:16px}
summary{cursor:pointer;font-weight:600}
details ol{padding-left:20px;margin:12px 0 0}
details li{margin:0 0 14px}
details img{display:block;width:100%;max-width:300px;border-radius:12px;border:1px solid var(--line);margin-top:8px}
.small{font-size:13px;color:var(--faint);margin-top:22px}
.small a{color:var(--dim)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:8px}
.box p{margin:0 0 4px;font-size:17px}
.note{font-size:14px;color:var(--dim);margin:10px 0 0}
.priv{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--green);background:var(--surface);border-radius:14px;padding:14px;margin:18px 0 0;font-size:15px}
.priv svg{flex:none;width:24px;height:24px;color:var(--green)}
.more{display:block;text-align:center;margin:10px 0 0;color:var(--accent)}
[data-flow]{display:none}
body.f-android [data-flow~="android"],body.f-ios [data-flow~="ios"],body.f-desktop [data-flow~="desktop"]{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><span class="brand">HONE</span><img src="/assets/join-kiskadee.jpg" alt="A great kiskadee perched on a branch" width="960" height="1307"></div>
  <p class="credit"><a id="credit" href="https://commons.wikimedia.org/wiki/File:Great_kiskadee_(70240).jpg" rel="noopener"></a></p>
  <h1 id="headline"></h1>
  <p class="intro" id="intro"></p>
  <h2 id="what_title"></h2>
  <ul class="what" id="what"></ul>

  <!-- Android: the app -->
  <div data-flow="android">
    <h2 id="setup_title"></h2>
    <ol class="setup" id="setup"></ol>
    <a class="cta" id="button" href="/app/hone-latest.apk"></a>
    <a class="sub" id="open_app" href="#"></a>
    <p class="code"><span id="code_hint"></span> <b id="refcode"></b></p>
    <details><summary id="howto_title"></summary><ol id="howto"></ol></details>
  </div>

  <!-- iPhone / iPad: listener on a computer, birds at /me -->
  <div data-flow="ios">
    <h2 id="ios_title"></h2>
    <div class="box"><p id="ios_text"></p></div>
    <a class="cta" id="ios_email" href="#"></a>
    <a class="cta alt" id="ios_me" href="/me"></a>
    <p class="note" id="ios_tip"></p>
  </div>

  <!-- Desktop: download section -->
  <div data-flow="desktop">
    <h2 id="desk_title"></h2>
    <p class="note" id="desk_text" style="margin:0 0 14px"></p>
    <div id="cards"></div>
    <a class="more" id="desk_more" href="/listener"></a>
    <p class="note" id="desk_android_wrap"><span id="desk_android"></span> <a id="desk_apk" href="/app/hone-latest.apk">Download the Android app</a></p>
  </div>

  <div class="priv" data-flow="ios desktop"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.5 7.5 9.5 4.4-1 7.5-4.9 7.5-9.5V6L12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="disclaimer"></span></div>

  <p class="small" id="small"></p>
  <p class="small"><a id="full" href="/"></a></p>
</div>
<script src="/assets/listener-install.js"></script>
<script>
(function () {
  var C = JSON.parse(document.getElementById("copy").textContent);
  var ref = HoneListener.cleanRef(new URLSearchParams(location.search).get("ref"));
  var dev = HoneListener.detect();
  var flow = dev === "android" ? "android" : (dev === "ios" ? "ios" : "desktop");
  var forced = new URLSearchParams(location.search).get("device");
  if (forced === "android" || forced === "ios" || forced === "desktop") flow = forced;
  document.body.classList.add("f-" + flow);
  var ICON = {
    list: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    map: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="9.5" r="2.5" stroke="currentColor" stroke-width="2" fill="none"/>',
    lock: '<rect x="4.5" y="10.5" width="15" height="10" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2" fill="none"/>',
    gift: '<rect x="3.5" y="8" width="17" height="4" rx="1" stroke="currentColor" stroke-width="2" fill="none"/><path d="M5 12v8h14v-8M12 8v12M12 8S10.5 3.5 8 4.5 9 8 12 8Zm0 0s1.5-4.5 4-3.5S15 8 12 8Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>'
  };
  function t(id, s) { var e = document.getElementById(id); if (e) e.textContent = s; }
  ["headline", "intro", "what_title", "setup_title", "button", "open_app", "code_hint", "howto_title",
   "ios_title", "ios_text", "ios_email", "ios_me", "ios_tip", "desk_title", "desk_text", "desk_more", "desk_android",
   "disclaimer", "full"].forEach(function (k) { t(k, C[k]); });
  t("credit", C.photo_credit);
  var w = document.getElementById("what");
  C.what.forEach(function (x) {
    var li = document.createElement("li");
    li.innerHTML = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' + (ICON[x[0]] || "") + "</svg>";
    var s = document.createElement("span"); s.textContent = x[1]; li.appendChild(s); w.appendChild(li);
  });
  var st = document.getElementById("setup");
  C.setup.forEach(function (x) { var li = document.createElement("li"); li.textContent = x; st.appendChild(li); });
  var h = document.getElementById("howto");
  C.howto.forEach(function (x, i) {
    var li = document.createElement("li"); li.textContent = x;
    var img = new Image(); img.alt = ""; img.loading = "lazy"; img.src = "/assets/join/step" + (i + 1) + ".png";
    img.onload = function () { li.appendChild(img); };
    h.appendChild(li);
  });
  t("small", ref ? C.small_ref.split("{referrer}").join(ref) : C.small_pool);
  t("refcode", ref || "none");
  if (!ref) document.querySelector(".code").style.display = "none";
  var q = ref ? "?ref=" + encodeURIComponent(ref) : "";
  var listenerLink = "https://honemesh.net/listener" + q;
  // Hands the invite code to the app: hone://join?ref=...
  var back = location.origin + location.pathname + location.search;
  document.getElementById("open_app").href = "intent://join?ref=" + encodeURIComponent(ref || "none") +
    "#Intent;scheme=hone;package=network.hone.app.debug;S.browser_fallback_url=" + encodeURIComponent(back) + ";end";
  document.getElementById("ios_email").href = "mailto:?subject=" + encodeURIComponent(C.ios_email_subject) +
    "&body=" + encodeURIComponent(C.ios_email_body.split("{link}").join(listenerLink));
  document.getElementById("desk_more").href = "/listener" + q;
  if (flow === "desktop") HoneListener.render(document.getElementById("cards"), { ref: ref, compact: true });
})();
</script>
</body>
</html>
