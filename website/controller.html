<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HONE Controller Wallet</title>
    <meta
      name="description"
      content="Use a Privy-connected wallet to sign a HONE spend challenge from the website. No HONE extension required."
    />
    <meta property="og:title" content="HONE Controller Wallet" />
    <meta
      property="og:description"
      content="Sign HONE spends with your Privy-connected wallet and submit the approval from the website. No HONE extension required."
    />
    <meta property="og:url" content="https://honemesh.net/controller" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #070b12;
        --panel: #0f172a;
        --card: #111c2e;
        --line: rgba(148, 163, 184, 0.16);
        --text: #e5eef9;
        --muted: #94a3b8;
        --accent: #f7931a;
        --accent-soft: rgba(247, 147, 26, 0.16);
        --good: #22c55e;
        --bad: #ef4444;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background:
          radial-gradient(circle at 20% 10%, rgba(247, 147, 26, 0.14), transparent 28%),
          radial-gradient(circle at 80% 0%, rgba(34, 211, 238, 0.12), transparent 22%),
          var(--bg);
        color: var(--text);
      }
      a {
        color: inherit;
      }
      .shell {
        max-width: 1120px;
        margin: 0 auto;
        padding: 28px 20px 64px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }
      .brand img {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        box-shadow: 0 0 20px rgba(247, 147, 26, 0.28);
      }
      .brand strong {
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      .navlinks {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 13px;
      }
      .navlinks a {
        text-decoration: none;
      }
      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.95fr);
        gap: 18px;
        align-items: stretch;
      }
      .panel {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 22px;
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.22);
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(247, 147, 26, 0.1);
        border: 1px solid rgba(247, 147, 26, 0.22);
        color: #ffd8a8;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 16px;
      }
      h1 {
        font-size: clamp(34px, 5vw, 62px);
        line-height: 1.02;
        margin: 0 0 16px;
      }
      h1 em {
        font-style: normal;
        color: var(--accent);
      }
      .lede {
        color: var(--muted);
        font-size: 16px;
        line-height: 1.75;
        max-width: 760px;
        margin: 0;
      }
      .stack {
        display: grid;
        gap: 12px;
      }
      .card {
        background: rgba(17, 28, 46, 0.88);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
      }
      .card h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }
      .card p,
      .card li,
      .muted {
        color: var(--muted);
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .field {
        display: grid;
        gap: 6px;
      }
      label {
        font-size: 13px;
        font-weight: 600;
        color: #cbd5e1;
      }
      input,
      select,
      textarea {
        width: 100%;
        background: #09111d;
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--text);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
        outline: none;
      }
      textarea {
        min-height: 134px;
        resize: vertical;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: rgba(247, 147, 26, 0.55);
        box-shadow: 0 0 0 3px rgba(247, 147, 26, 0.12);
      }
      .btn {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        background: var(--accent);
        color: #111;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      .btn.secondary {
        background: rgba(148, 163, 184, 0.12);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.22);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        min-height: 22px;
        color: var(--muted);
        font-size: 13px;
      }
      .status.ok {
        color: var(--good);
      }
      .status.error {
        color: var(--bad);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .list {
        display: grid;
        gap: 10px;
      }
      .item {
        background: rgba(9, 17, 29, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.14);
        border-radius: 14px;
        padding: 12px 14px;
        display: grid;
        gap: 6px;
      }
      .item strong {
        font-size: 13px;
      }
      .item span {
        font-size: 12px;
        color: var(--muted);
        word-break: break-word;
      }
      .split {
        display: grid;
        gap: 18px;
        margin-top: 18px;
      }
      .hint {
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid rgba(247, 147, 26, 0.22);
        background: rgba(247, 147, 26, 0.08);
        color: #fbd5a7;
        line-height: 1.6;
        font-size: 14px;
      }
      @media (max-width: 980px) {
        .hero,
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="controller-app"></div>
    <script type="module" src="/js/controller-page.mjs"></script>
  </body>
</html>
