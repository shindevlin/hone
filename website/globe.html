<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTCPC Global Nervous System</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e17; color: #c8ccd4; font-family: 'Courier New', Courier, monospace; }

#canvas-container { position: fixed; inset: 0; z-index: 0; }
canvas { display: block; width: 100%; height: 100%; }

/* Stats bar */
#stats-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center; gap: 32px; flex-wrap: wrap;
  padding: 10px 20px;
  background: linear-gradient(180deg, rgba(10,14,23,0.95) 0%, rgba(10,14,23,0.6) 100%);
  border-bottom: 1px solid rgba(247,147,26,0.2);
  font-size: 13px; letter-spacing: 0.5px;
}
#stats-bar .stat-item { display: flex; align-items: center; gap: 6px; }
#stats-bar .stat-label { color: #667; text-transform: uppercase; font-size: 10px; }
#stats-bar .stat-value { color: #f7931a; font-weight: bold; }
#stats-bar .stat-value.alive { color: #22c55e; }

/* Sidebar */
#sidebar {
  position: fixed; top: 50px; right: 0; bottom: 0; width: 320px; z-index: 10;
  background: linear-gradient(270deg, rgba(10,14,23,0.92) 0%, rgba(10,14,23,0.7) 100%);
  border-left: 1px solid rgba(247,147,26,0.15);
  padding: 20px 16px; overflow: hidden;
  display: flex; flex-direction: column;
}
#sidebar h2 {
  font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
  color: #f7931a; margin-bottom: 16px; border-bottom: 1px solid rgba(247,147,26,0.3);
  padding-bottom: 8px;
}
#sidebar .section { margin-bottom: 20px; }
#sidebar .section-title { font-size: 11px; color: #556; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
#sidebar .metric { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
#sidebar .metric .val { color: #f7931a; }

/* Event log */
#event-log {
  flex: 1; overflow: hidden; position: relative;
  border: 1px solid rgba(0,255,100,0.1); border-radius: 4px;
  padding: 8px; background: rgba(0,20,0,0.3);
}
#event-log .event-line {
  font-size: 11px; line-height: 1.6; color: #22c55e; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; opacity: 0; animation: fadeInEvent 0.3s forwards;
}
@keyframes fadeInEvent { to { opacity: 1; } }
.event-line .ts { color: #334; margin-right: 6px; }

/* Matrix rain overlay in event log */
#matrix-canvas {
  position: absolute; inset: 0; z-index: 0; opacity: 0.06; pointer-events: none;
}
#event-log .event-line { position: relative; z-index: 1; }

/* Toggle + controls */
#controls {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20;
  display: flex; gap: 12px;
}
#controls button {
  background: rgba(247,147,26,0.15); color: #f7931a; border: 1px solid rgba(247,147,26,0.4);
  padding: 8px 20px; border-radius: 6px; font-family: inherit; font-size: 12px;
  cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s;
}
#controls button:hover { background: rgba(247,147,26,0.3); }
#controls button.active { background: #f7931a; color: #0a0e17; }

/* Leaderboard tooltip */
#node-tooltip {
  position: fixed; z-index: 30; pointer-events: none; display: none;
  background: rgba(10,14,23,0.95); border: 1px solid #f7931a; border-radius: 6px;
  padding: 10px 14px; font-size: 12px; max-width: 220px;
}
#node-tooltip .tt-name { color: #f7931a; font-weight: bold; margin-bottom: 4px; }
#node-tooltip .tt-roles { color: #00ffff; font-size: 11px; }
#node-tooltip .tt-balance { color: #22c55e; font-size: 11px; margin-top: 2px; }

/* Mobile */
@media (max-width: 768px) {
  #sidebar { width: 100%; top: auto; bottom: 0; height: 200px; border-left: none; border-top: 1px solid rgba(247,147,26,0.15); }
  #stats-bar { font-size: 11px; gap: 16px; padding: 6px 12px; }
  #controls { bottom: 210px; }
}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

// ============================================================
// CONFIGURATION
// ============================================================
const GLOBE_RADIUS = 5;
const ARC_HEIGHT = 1.8;
const HUB_SIZE = 0.18;
const ROTATION_SPEED = 0.05 * Math.PI * 2 / 60; // 0.05 RPM
const COORDINATE_FUZZ_KM = 50;
const API_BASE = location.origin;

// Known node positions (mock coords, fuzzed at runtime)
const KNOWN_POSITIONS = {
  shindevlin:       { lat: 13.69, lon: -89.19 },
  natoshisakamoto:  { lat: 13.72, lon: -89.21 },
};

// Fallback positions for nodes without known coords — distributed globally
const FALLBACK_POSITIONS = [
  { lat: 35.68, lon: 139.69 },   // Tokyo
  { lat: 51.51, lon: -0.13 },    // London
  { lat: 40.71, lon: -74.01 },   // NYC
  { lat: -33.87, lon: 151.21 },  // Sydney
  { lat: 48.86, lon: 2.35 },     // Paris
  { lat: 55.76, lon: 37.62 },    // Moscow
  { lat: 19.43, lon: -99.13 },   // Mexico City
  { lat: -23.55, lon: -46.63 },  // Sao Paulo
  { lat: 1.35, lon: 103.82 },    // Singapore
  { lat: 37.57, lon: 126.98 },   // Seoul
  { lat: 28.61, lon: 77.21 },    // Delhi
  { lat: -1.29, lon: 36.82 },    // Nairobi
  { lat: 30.04, lon: 31.24 },    // Cairo
  { lat: 59.33, lon: 18.07 },    // Stockholm
  { lat: -34.60, lon: -58.38 },  // Buenos Aires
];

// ============================================================
// STATE
// ============================================================
let networkData = null;
let leaderboardData = null;
let is3D = true;
let nodeObjects = [];
let arcObjects = [];
let storageTrails = [];
let sensorPulses = [];
let clock = new THREE.Clock();

// ============================================================
// SCENE SETUP
// ============================================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e17);
scene.fog = new THREE.FogExp2(0x0a0e17, 0.015);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 0.5;
controls.zoomSpeed = 0.8;
controls.minDistance = 7;
controls.maxDistance = 30;
controls.enablePan = false;

// Bloom
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.5,   // strength
  0.4,   // radius
  0.85   // threshold
);
composer.addPass(bloomPass);

// ============================================================
// LIGHTING
// ============================================================
const ambientLight = new THREE.AmbientLight(0x334466, 0.8);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.3);
dirLight.position.set(5, 3, 5);
scene.add(dirLight);
// Fill light so dark side isn't completely black
const fillLight = new THREE.DirectionalLight(0x1a2a4a, 0.4);
fillLight.position.set(-5, -2, -5);
scene.add(fillLight);

// ============================================================
// GLOBE — procedural landmass via lat/lon point cloud
// ============================================================
const globeGroup = new THREE.Group();
scene.add(globeGroup);

// Flat map group (populated later, declared here to avoid temporal dead zone)
const flatMapGroup = new THREE.Group();
flatMapGroup.visible = false;
scene.add(flatMapGroup);

// Dark ocean sphere
const oceanGeo = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
const oceanMat = new THREE.MeshPhongMaterial({
  color: 0x020408,
  emissive: 0x050810,
  transparent: true,
  opacity: 0.95,
  shininess: 5,
});
const oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
globeGroup.add(oceanMesh);

// Atmosphere glow
const atmosGeo = new THREE.SphereGeometry(GLOBE_RADIUS * 1.015, 64, 64);
const atmosMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.65 - dot(vNormal, vec3(0,0,1.0)), 2.0);
      gl_FragColor = vec4(0.15, 0.35, 0.7, 1.0) * intensity * 1.8;
    }
  `,
  side: THREE.BackSide,
  blending: THREE.AdditiveBlending,
  transparent: true,
});
globeGroup.add(new THREE.Mesh(atmosGeo, atmosMat));

// Grid lines (subtle)
const gridMat = new THREE.LineBasicMaterial({ color: 0x304070, transparent: true, opacity: 0.35 });
for (let lat = -60; lat <= 60; lat += 30) {
  const pts = [];
  for (let lon = 0; lon <= 360; lon += 2) {
    pts.push(latLonToVec3(lat, lon - 180, GLOBE_RADIUS * 1.001));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  globeGroup.add(new THREE.Line(geo, gridMat));
}
for (let lon = -180; lon < 180; lon += 30) {
  const pts = [];
  for (let lat = -90; lat <= 90; lat += 2) {
    pts.push(latLonToVec3(lat, lon, GLOBE_RADIUS * 1.001));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  globeGroup.add(new THREE.Line(geo, gridMat));
}

// Detailed continent outlines — denser polygon points for smooth coastlines
const continents = [
  // North America (detailed)
  [[72,-168],[72,-140],[70,-140],[68,-165],[66,-168],[64,-165],[62,-163],[60,-148],[60,-140],[58,-137],[56,-133],[54,-131],[52,-128],[50,-125],[48,-124],[46,-124],[44,-124],[42,-124],[40,-122],[38,-122],[36,-121],[34,-120],[32,-117],[30,-115],[28,-112],[27,-110],[26,-108],[26,-105],[26,-100],[26,-98],[28,-96],[28,-92],[30,-88],[30,-85],[29,-83],[27,-80],[25,-80],[25,-78],[30,-75],[35,-75],[40,-73],[42,-70],[44,-66],[46,-64],[48,-60],[50,-56],[52,-56],[54,-58],[55,-60],[56,-62],[58,-64],[60,-65],[62,-64],[64,-64],[66,-62],[68,-65],[70,-72],[72,-80],[72,-95],[72,-110],[72,-130],[72,-150],[72,-168]],
  // Central America
  [[20,-105],[18,-105],[16,-98],[15,-92],[14,-88],[12,-86],[10,-84],[9,-80],[8,-77],[9,-79],[10,-83],[12,-87],[14,-90],[16,-96],[18,-103],[20,-105]],
  // South America (detailed)
  [[12,-72],[11,-68],[10,-65],[8,-60],[6,-55],[4,-52],[2,-50],[0,-50],[-2,-44],[-4,-38],[-6,-35],[-8,-35],[-10,-37],[-12,-38],[-14,-39],[-16,-40],[-18,-40],[-20,-40],[-22,-41],[-24,-46],[-26,-48],[-28,-49],[-30,-50],[-32,-52],[-34,-54],[-36,-57],[-38,-58],[-40,-62],[-42,-64],[-44,-65],[-46,-66],[-48,-66],[-50,-68],[-52,-70],[-54,-70],[-54,-68],[-52,-68],[-50,-66],[-48,-64],[-46,-64],[-44,-63],[-42,-62],[-38,-58],[-36,-56],[-34,-53],[-30,-50],[-26,-48],[-22,-44],[-18,-42],[-14,-46],[-12,-52],[-10,-58],[-8,-64],[-6,-70],[-4,-76],[-2,-80],[0,-80],[2,-78],[4,-78],[6,-76],[8,-76],[10,-74],[12,-72]],
  // Europe (detailed)
  [[36,-10],[37,-8],[38,-5],[40,-4],[42,-3],[43,0],[43,3],[44,5],[44,8],[44,10],[44,12],[45,13],[44,14],[43,16],[42,18],[41,20],[40,22],[40,24],[41,26],[42,28],[42,30],[44,30],[46,30],[48,32],[50,30],[52,28],[54,24],[55,20],[56,18],[57,16],[58,14],[58,12],[60,10],[60,8],[58,6],[56,8],[54,8],[53,6],[52,4],[51,2],[50,0],[48,-2],[47,-4],[46,-6],[44,-8],[42,-9],[40,-9],[38,-10],[36,-10]],
  // Africa (detailed)
  [[37,10],[36,5],[35,0],[34,-2],[32,-5],[30,-8],[28,-12],[26,-15],[24,-17],[22,-17],[20,-17],[18,-16],[16,-16],[14,-17],[12,-16],[10,-14],[8,-12],[6,-8],[5,-5],[4,-2],[4,2],[4,6],[4,10],[2,10],[0,10],[-2,10],[-4,12],[-6,12],[-8,14],[-10,14],[-12,14],[-14,12],[-16,12],[-18,14],[-20,16],[-22,16],[-24,16],[-26,18],[-28,18],[-30,18],[-32,18],[-34,18],[-34,20],[-34,24],[-34,26],[-32,28],[-30,30],[-28,32],[-26,34],[-22,36],[-18,38],[-14,40],[-10,42],[-6,44],[-2,46],[0,48],[2,50],[4,50],[6,50],[8,48],[10,46],[12,44],[14,44],[16,42],[18,42],[20,40],[22,38],[24,36],[26,34],[28,33],[30,32],[32,32],[34,28],[35,25],[36,20],[37,14],[37,10]],
  // Asia (detailed)
  [[42,30],[40,32],[38,34],[36,36],[34,36],[32,36],[30,36],[28,40],[26,44],[24,46],[22,44],[20,42],[18,44],[16,46],[14,48],[12,50],[10,52],[8,60],[6,70],[4,80],[2,90],[0,100],[-2,105],[-4,106],[-6,108],[-8,112],[-8,116],[-6,118],[-4,118],[-2,118],[0,118],[2,116],[4,114],[6,112],[8,108],[10,106],[12,106],[14,108],[16,108],[18,108],[20,107],[22,110],[24,112],[26,116],[28,120],[30,122],[32,122],[34,120],[36,122],[38,124],[40,128],[42,132],[44,134],[46,136],[48,140],[50,142],[52,142],[54,140],[56,138],[58,140],[60,142],[62,150],[64,160],[66,170],[68,180],[70,178],[72,170],[72,160],[72,140],[72,120],[70,110],[68,100],[66,90],[64,80],[62,70],[60,62],[58,56],[56,52],[54,48],[52,44],[50,42],[48,38],[46,36],[44,34],[42,30]],
  // India
  [[28,68],[26,70],[24,72],[22,73],[20,73],[18,74],[16,76],[14,77],[12,78],[10,78],[8,77],[8,76],[10,76],[12,77],[14,78],[16,78],[18,76],[20,74],[22,72],[24,70],[26,68],[28,68]],
  // Australia (detailed)
  [[-12,130],[-13,128],[-14,126],[-16,124],[-18,122],[-20,118],[-22,114],[-24,114],[-26,114],[-28,114],[-30,116],[-32,116],[-34,118],[-34,122],[-34,128],[-36,134],[-36,138],[-38,142],[-38,146],[-38,148],[-36,150],[-34,152],[-32,152],[-30,154],[-28,154],[-26,152],[-24,152],[-22,150],[-20,148],[-18,146],[-16,146],[-14,144],[-12,142],[-12,138],[-12,134],[-12,130]],
  // Greenland
  [[60,-44],[62,-42],[64,-40],[66,-38],[68,-36],[70,-32],[72,-28],[74,-22],[76,-20],[78,-22],[80,-26],[80,-40],[78,-50],[76,-56],[74,-58],[72,-56],[70,-52],[68,-50],[66,-50],[64,-48],[62,-46],[60,-44]],
  // UK/Ireland
  [[50,-6],[51,-5],[52,-4],[53,-3],[54,-2],[55,-2],[56,-3],[57,-4],[58,-5],[58,-6],[57,-6],[56,-5],[55,-5],[54,-4],[53,-3],[52,-4],[51,-5],[50,-6]],
  // Japan
  [[32,130],[34,132],[36,136],[38,138],[40,140],[42,142],[44,144],[44,142],[42,140],[40,138],[38,136],[36,134],[34,132],[32,130]],
];

// Land outline — bright enough to clearly trace coastlines
const landMat = new THREE.LineBasicMaterial({ color: 0x40b080, transparent: true, opacity: 0.85, linewidth: 1 });
continents.forEach(poly => {
  const pts = poly.map(([lat, lon]) => latLonToVec3(lat, lon, GLOBE_RADIUS * 1.002));
  pts.push(pts[0].clone()); // close the loop
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  globeGroup.add(new THREE.Line(geo, landMat));
});

// Filled landmass — subtle translucent fill by creating closed shape triangulations
// Land fill — green-tinted, clearly distinct from dark blue ocean
const landFillMat = new THREE.MeshBasicMaterial({ color: 0x0d2a1e, transparent: true, opacity: 0.75, side: THREE.DoubleSide });
continents.forEach(poly => {
  // Simple fan triangulation from centroid
  const pts3d = poly.map(([lat, lon]) => latLonToVec3(lat, lon, GLOBE_RADIUS * 1.0015));
  const centroid = new THREE.Vector3();
  pts3d.forEach(p => centroid.add(p));
  centroid.divideScalar(pts3d.length);
  centroid.normalize().multiplyScalar(GLOBE_RADIUS * 1.0015);

  const verts = [];
  for (let i = 0; i < pts3d.length; i++) {
    const next = (i + 1) % pts3d.length;
    verts.push(centroid.x, centroid.y, centroid.z);
    verts.push(pts3d[i].x, pts3d[i].y, pts3d[i].z);
    verts.push(pts3d[next].x, pts3d[next].y, pts3d[next].z);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.computeVertexNormals();
  globeGroup.add(new THREE.Mesh(geo, landFillMat));
});

// Star field
const starGeo = new THREE.BufferGeometry();
const starPositions = [];
for (let i = 0; i < 2000; i++) {
  const r = 80 + Math.random() * 120;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPositions.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({ color: 0x556688, size: 0.15, transparent: true, opacity: 0.6 });
scene.add(new THREE.Points(starGeo, starMat));

// ============================================================
// UTILITIES
// ============================================================
function latLonToVec3(lat, lon, radius) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

function fuzzCoord(lat, lon) {
  // ~50km random jitter (approx 0.45 degrees)
  const jitter = COORDINATE_FUZZ_KM / 111;
  return {
    lat: lat + (Math.random() - 0.5) * 2 * jitter,
    lon: lon + (Math.random() - 0.5) * 2 * jitter / Math.cos(lat * Math.PI / 180),
  };
}

function getNodePosition(name, index) {
  let base;
  if (KNOWN_POSITIONS[name]) {
    base = KNOWN_POSITIONS[name];
  } else {
    base = FALLBACK_POSITIONS[index % FALLBACK_POSITIONS.length];
  }
  return fuzzCoord(base.lat, base.lon);
}

// ============================================================
// NODE HUBS — glowing hexagonal points
// ============================================================
function createHexagonGeometry(radius, height) {
  const shape = new THREE.Shape();
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 3) * i - Math.PI / 6;
    const x = radius * Math.cos(angle);
    const y = radius * Math.sin(angle);
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
  return geo;
}

function createNodeHub(name, lat, lon, roles) {
  const group = new THREE.Group();

  // Determine color based on primary role
  let color = 0xf7931a; // default orange
  if (roles.includes('miner')) color = 0xff00ff;
  else if (roles.includes('clock')) color = 0x22c55e;
  else if (roles.includes('storage')) color = 0x00ffff;

  // Hex marker
  const hexGeo = createHexagonGeometry(HUB_SIZE, 0.02);
  const hexMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 });
  const hex = new THREE.Mesh(hexGeo, hexMat);

  // Orient to globe surface
  const pos = latLonToVec3(lat, lon, GLOBE_RADIUS * 1.005);
  group.position.copy(pos);
  group.lookAt(new THREE.Vector3(0, 0, 0));
  group.rotateX(Math.PI / 2);

  group.add(hex);

  // Glow ring
  const ringGeo = new THREE.RingGeometry(HUB_SIZE * 1.2, HUB_SIZE * 2.2, 6);
  const ringMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.z = 0.01;
  group.add(ring);

  // Pulse ring (animated)
  const pulseGeo = new THREE.RingGeometry(HUB_SIZE * 0.5, HUB_SIZE * 3.5, 32);
  const pulseMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
  const pulse = new THREE.Mesh(pulseGeo, pulseMat);
  pulse.position.z = 0.02;
  group.add(pulse);

  // Point light for glow
  const pointLight = new THREE.PointLight(color, 0.8, 3);
  pointLight.position.z = 0.1;
  group.add(pointLight);

  // Account name label (sprite)
  const labelCanvas = document.createElement('canvas');
  labelCanvas.width = 256;
  labelCanvas.height = 64;
  const ctx = labelCanvas.getContext('2d');
  ctx.fillStyle = `#${color.toString(16).padStart(6, '0')}`;
  ctx.font = 'bold 28px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(name, 128, 38);
  const labelTexture = new THREE.CanvasTexture(labelCanvas);
  const labelMat = new THREE.SpriteMaterial({ map: labelTexture, transparent: true, opacity: 0.85, depthTest: false });
  const label = new THREE.Sprite(labelMat);
  label.scale.set(1.2, 0.3, 1);
  label.position.z = 0.3;
  group.add(label);

  group.userData = { name, lat, lon, roles, pulse, pulseMat, ring, ringMat, phase: Math.random() * Math.PI * 2 };
  globeGroup.add(group);
  return group;
}

// ============================================================
// INFERENCE ARCS — neon magenta great circle arcs
// ============================================================
function createArc(fromLatLon, toLatLon, color, thickness, speed) {
  const from = latLonToVec3(fromLatLon.lat, fromLatLon.lon, GLOBE_RADIUS * 1.01);
  const to = latLonToVec3(toLatLon.lat, toLatLon.lon, GLOBE_RADIUS * 1.01);

  // Mid-point raised above surface
  const mid = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
  const dist = from.distanceTo(to);
  mid.normalize().multiplyScalar(GLOBE_RADIUS + ARC_HEIGHT * (dist / (GLOBE_RADIUS * 2)));

  const curve = new THREE.QuadraticBezierCurve3(from, mid, to);
  const points = curve.getPoints(60);
  const geo = new THREE.BufferGeometry().setFromPoints(points);

  // Animated draw using drawRange
  geo.setDrawRange(0, 0);

  const mat = new THREE.LineBasicMaterial({
    color,
    transparent: true,
    opacity: 0.8,
    linewidth: thickness,
  });
  const line = new THREE.Line(geo, mat);
  line.userData = {
    totalPoints: 61,
    progress: 0,
    speed: speed || 0.8 + Math.random() * 0.5,
    phase: 'draw', // draw -> hold -> fade -> done
    holdTime: 0,
    opacity: 0.8,
  };
  globeGroup.add(line);
  return line;
}

// ============================================================
// SENSOR PULSES — amber particle bursts
// ============================================================
function createSensorPulse(lat, lon) {
  const pos = latLonToVec3(lat, lon, GLOBE_RADIUS * 1.01);
  const particleCount = 20;
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const velocities = [];

  for (let i = 0; i < particleCount; i++) {
    positions[i * 3] = pos.x;
    positions[i * 3 + 1] = pos.y;
    positions[i * 3 + 2] = pos.z;
    const dir = new THREE.Vector3(pos.x, pos.y, pos.z).normalize();
    const tangent = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).cross(dir).normalize();
    velocities.push(dir.clone().multiplyScalar(0.02 + Math.random() * 0.03).add(tangent.multiplyScalar(0.01)));
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

  const mat = new THREE.PointsMaterial({ color: 0xf7931a, size: 0.06, transparent: true, opacity: 1.0 });
  const points = new THREE.Points(geo, mat);
  points.userData = { velocities, life: 1.0, positions };
  globeGroup.add(points);
  return points;
}

// ============================================================
// STORAGE TRAILS — cyan streams
// ============================================================
function createStorageTrail(fromLatLon, toLatLon) {
  const from = latLonToVec3(fromLatLon.lat, fromLatLon.lon, GLOBE_RADIUS * 1.008);
  const to = latLonToVec3(toLatLon.lat, toLatLon.lon, GLOBE_RADIUS * 1.008);
  const mid = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
  const dist = from.distanceTo(to);
  mid.normalize().multiplyScalar(GLOBE_RADIUS + ARC_HEIGHT * 0.5 * (dist / (GLOBE_RADIUS * 2)));

  const curve = new THREE.QuadraticBezierCurve3(from, mid, to);
  const tubeGeo = new THREE.TubeGeometry(curve, 40, 0.015, 6, false);
  const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.0 });
  const mesh = new THREE.Mesh(tubeGeo, mat);
  mesh.userData = { progress: 0, speed: 0.3 + Math.random() * 0.2, phase: 'in' };
  globeGroup.add(mesh);
  return mesh;
}

// ============================================================
// DATA FETCHING
// ============================================================
async function fetchData() {
  try {
    const [netRes, lbRes] = await Promise.allSettled([
      fetch(`${API_BASE}/public/network`).then(r => r.json()),
      fetch(`${API_BASE}/public/leaderboard`).then(r => r.json()),
    ]);
    if (netRes.status === 'fulfilled') {
      networkData = netRes.value;
      updateStatsBar(networkData);
      updateSidebarMetrics(networkData);
    }
    if (lbRes.status === 'fulfilled') {
      leaderboardData = lbRes.value;
      updateLeaderboard(lbRes.value);
    }
  } catch (e) {
    // Silently use mock data
  }
  rebuildNodes();
}

function updateStatsBar(d) {
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('s-epoch', d.epoch || '--');
  set('s-nodes', d.nodes || '--');
  set('s-miners', d.miners || '--');
  set('s-clocks', d.clocks || '--');
  set('s-storage', d.storage || '--');
  const statusEl = document.getElementById('s-status');
  if (statusEl) {
    statusEl.textContent = d.alive ? 'ALIVE' : 'STALE';
    statusEl.style.color = d.alive ? '#22c55e' : '#f7931a';
  }
}

function updateSidebarMetrics(d) {
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  set('m-peers', d.peer_count || '--');
  set('m-bclocks', d.browser_clocks || '--');
  set('m-gateways', d.gateways || '--');
  set('m-verifiers', d.verifiers || '--');
}

function updateLeaderboard(d) {
  const el = document.getElementById('leaderboard-list');
  if (!el || !d.leaderboard) return;
  document.getElementById('m-accounts').textContent = d.total_accounts || '--';
  el.innerHTML = d.leaderboard.slice(0, 8).map((e, i) => {
    const bal = typeof e.balance === 'number' ? (e.balance / 1e10).toFixed(2) : '0';
    const roles = e.roles && e.roles.length ? e.roles.join(', ') : 'user';
    return `<div style="display:flex;justify-content:space-between;padding:2px 0;color:${i < 3 ? '#f7931a' : '#667'}"><span>${e.account}</span><span style="color:#22c55e">${bal}</span></div>`;
  }).join('');
}

// ============================================================
// REBUILD NODES FROM DATA
// ============================================================
let nodePositionMap = {};
let flatNodeObjects = [];  // forward declaration — populated after flatMapGroup is created

function rebuildNodes() {
  // Clear existing globe nodes
  nodeObjects.forEach(n => globeGroup.remove(n));
  nodeObjects = [];
  // Clear existing flat nodes
  flatNodeObjects.forEach(n => flatMapGroup.remove(n));
  flatNodeObjects = [];
  nodePositionMap = {};

  // Gather accounts
  let accounts = [];
  if (leaderboardData && leaderboardData.leaderboard) {
    accounts = leaderboardData.leaderboard.map(e => ({ name: e.account, roles: e.roles || [] }));
  }

  // Ensure at least some nodes for visual interest
  if (accounts.length === 0) {
    accounts = [
      { name: 'shindevlin', roles: ['miner'] },
      { name: 'natoshisakamoto', roles: ['miner', 'clock'] },
      { name: 'node_alpha', roles: ['storage'] },
      { name: 'node_beta', roles: ['clock'] },
      { name: 'node_gamma', roles: ['miner'] },
    ];
  }

  accounts.forEach((acc, i) => {
    const pos = getNodePosition(acc.name, i);
    nodePositionMap[acc.name] = pos;
    const hub = createNodeHub(acc.name, pos.lat, pos.lon, acc.roles);
    nodeObjects.push(hub);
    // Also create flat map node
    const flatHub = createFlatNodeHub(acc.name, pos.lat, pos.lon, acc.roles);
    flatNodeObjects.push(flatHub);
  });
}

// ============================================================
// PERIODIC EFFECTS — fire arcs, trails, sensor pulses
// ============================================================
let effectTimer = 0;

function fireRandomEffect() {
  const names = Object.keys(nodePositionMap);
  if (names.length < 2) return;

  const roll = Math.random();
  const fromIdx = Math.floor(Math.random() * names.length);
  let toIdx = Math.floor(Math.random() * names.length);
  while (toIdx === fromIdx && names.length > 1) toIdx = Math.floor(Math.random() * names.length);

  const from = nodePositionMap[names[fromIdx]];
  const to = nodePositionMap[names[toIdx]];

  if (roll < 0.30) {
    // Inference request (magenta laser)
    const arc = createArc(from, to, 0xff00ff, 2.5, 1.0 + Math.random() * 0.8);
    arcObjects.push(arc);
    const models = ['qwen3.5:9b','qwen2.5:0.5b','llama3:8b','deepseek-r1:8b'];
    addEvent('INFERENCE', `${names[fromIdx]} → ${names[toIdx]} (${models[Math.floor(Math.random()*models.length)]})`);
  } else if (roll < 0.50) {
    // Storage sync (cyan stream)
    const trail = createStorageTrail(from, to);
    storageTrails.push(trail);
    const sizes = ['2.4MB','512KB','1.1MB','8.7MB','340KB'];
    addEvent('STORAGE', `${names[fromIdx]} ↔ ${names[toIdx]} ${sizes[Math.floor(Math.random()*sizes.length)]}`);
  } else if (roll < 0.65) {
    // Sensor reading (amber pulse)
    const target = nodePositionMap[names[fromIdx]];
    const pulse = createSensorPulse(target.lat, target.lon);
    sensorPulses.push(pulse);
    const types = ['subghz -92dBm','temp 42.3°C','ble 5 devices','air PM2.5=12','humidity 68%'];
    addEvent('SENSOR', `${names[fromIdx]} ${types[Math.floor(Math.random()*types.length)]}`);
  } else if (roll < 0.80) {
    // Clock heartbeat (green arc, fast)
    const arc = createArc(from, to, 0x22c55e, 1.5, 1.5 + Math.random() * 0.5);
    arcObjects.push(arc);
    addEvent('CLOCK', `${names[fromIdx]} epoch heartbeat`);
  } else if (roll < 0.92) {
    // Verification (yellow arc)
    const arc = createArc(from, to, 0xfbbf24, 1.5, 0.6 + Math.random() * 0.4);
    arcObjects.push(arc);
    addEvent('VERIFY', `${names[toIdx]} verifying ${names[fromIdx]}`);
  } else {
    // P2P relay (dim white)
    const arc = createArc(from, to, 0x667788, 1, 2.0);
    arcObjects.push(arc);
    addEvent('P2P', `peer sync ${names[fromIdx]} ↔ ${names[toIdx]}`);
  }
}

// ============================================================
// FLAT MAP GROUP — equirectangular projection on a plane
// (flatMapGroup declared earlier with globeGroup)
// ============================================================
const FLAT_W = 14;  // width of the flat map rectangle
const FLAT_H = 7;   // height

// Dark background plane
const flatBgGeo = new THREE.PlaneGeometry(FLAT_W, FLAT_H);
const flatBgMat = new THREE.MeshBasicMaterial({ color: 0x060a14, side: THREE.DoubleSide });
const flatBgMesh = new THREE.Mesh(flatBgGeo, flatBgMat);
flatMapGroup.add(flatBgMesh);

// Border
const flatBorderPts = [
  new THREE.Vector3(-FLAT_W/2, -FLAT_H/2, 0.001),
  new THREE.Vector3( FLAT_W/2, -FLAT_H/2, 0.001),
  new THREE.Vector3( FLAT_W/2,  FLAT_H/2, 0.001),
  new THREE.Vector3(-FLAT_W/2,  FLAT_H/2, 0.001),
  new THREE.Vector3(-FLAT_W/2, -FLAT_H/2, 0.001),
];
const flatBorderGeo = new THREE.BufferGeometry().setFromPoints(flatBorderPts);
const flatBorderMat = new THREE.LineBasicMaterial({ color: 0x3a5080, transparent: true, opacity: 0.6 });
flatMapGroup.add(new THREE.Line(flatBorderGeo, flatBorderMat));

// Grid lines on flat map
const flatGridMat = new THREE.LineBasicMaterial({ color: 0x253060, transparent: true, opacity: 0.3 });
for (let lat = -60; lat <= 60; lat += 30) {
  const y = (lat / 90) * (FLAT_H / 2);
  const pts = [new THREE.Vector3(-FLAT_W/2, y, 0.001), new THREE.Vector3(FLAT_W/2, y, 0.001)];
  flatMapGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), flatGridMat));
}
for (let lon = -180; lon < 180; lon += 30) {
  const x = (lon / 180) * (FLAT_W / 2);
  const pts = [new THREE.Vector3(x, -FLAT_H/2, 0.001), new THREE.Vector3(x, FLAT_H/2, 0.001)];
  flatMapGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), flatGridMat));
}

function latLonToFlat(lat, lon) {
  return new THREE.Vector3(
    (lon / 180) * (FLAT_W / 2),
    (lat / 90) * (FLAT_H / 2),
    0.002
  );
}

// Continent outlines on flat map
const flatLandMat = new THREE.LineBasicMaterial({ color: 0x40b080, transparent: true, opacity: 0.85 });
const flatLandFillMat = new THREE.MeshBasicMaterial({ color: 0x0d2a1e, transparent: true, opacity: 0.75, side: THREE.DoubleSide });

continents.forEach(poly => {
  // Outline
  const pts = poly.map(([lat, lon]) => latLonToFlat(lat, lon));
  pts.push(pts[0].clone());
  flatMapGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), flatLandMat));

  // Fill
  const pts2d = poly.map(([lat, lon]) => latLonToFlat(lat, lon));
  const centroid = new THREE.Vector3();
  pts2d.forEach(p => centroid.add(p));
  centroid.divideScalar(pts2d.length);
  centroid.z = 0.0015;

  const verts = [];
  for (let i = 0; i < pts2d.length; i++) {
    const next = (i + 1) % pts2d.length;
    verts.push(centroid.x, centroid.y, centroid.z);
    verts.push(pts2d[i].x, pts2d[i].y, pts2d[i].z);
    verts.push(pts2d[next].x, pts2d[next].y, pts2d[next].z);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.computeVertexNormals();
  flatMapGroup.add(new THREE.Mesh(geo, flatLandFillMat));
});

// Flat node hubs (createFlatNodeHub) — flatNodeObjects declared earlier

  // Point light

  labelCanvas.height = 64;

  ctx.fillStyle = `#${color.toString(16).padStart(6, '0')}`;

  label.scale.set(1.2, 0.3, 1);

  group.userData = { name, lat, lon, roles, pulse, pulseMat, phase: Math.random() * Math.PI * 2 };

// ============================================================
// ANIMATION LOOP
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  // Auto-rotate
  if (is3D) {
    globeGroup.rotation.y += ROTATION_SPEED * dt;
  }

  controls.update();

  // Animate node pulses (globe)
  nodeObjects.forEach(node => {
    const ud = node.userData;
    const t = elapsed + ud.phase;
    const scale = 1 + 0.3 * Math.sin(t * 2);
    if (ud.pulse) {
      ud.pulse.scale.set(scale, scale, 1);
      ud.pulseMat.opacity = 0.3 + 0.3 * Math.abs(Math.sin(t * 2));
    }
    if (ud.ringMat) {
      ud.ringMat.opacity = 0.2 + 0.2 * Math.abs(Math.sin(t * 1.5 + 1));
    }
  });

  // Animate flat map node pulses
  flatNodeObjects.forEach(node => {
    const ud = node.userData;
    const t = elapsed + ud.phase;
    const scale = 1 + 0.3 * Math.sin(t * 2);
    if (ud.pulse) {
      ud.pulse.scale.set(scale, scale, 1);
      ud.pulseMat.opacity = 0.3 + 0.3 * Math.abs(Math.sin(t * 2));
    }
  });

  // Animate inference arcs
  for (let i = arcObjects.length - 1; i >= 0; i--) {
    const arc = arcObjects[i];
    const ud = arc.userData;
    if (ud.phase === 'draw') {
      ud.progress += ud.speed * dt;
      const count = Math.min(Math.floor(ud.progress * ud.totalPoints), ud.totalPoints);
      arc.geometry.setDrawRange(0, count);
      if (count >= ud.totalPoints) {
        ud.phase = 'hold';
        ud.holdTime = 0;
      }
    } else if (ud.phase === 'hold') {
      ud.holdTime += dt;
      if (ud.holdTime > 0.8) ud.phase = 'fade';
    } else if (ud.phase === 'fade') {
      ud.opacity -= dt * 1.5;
      arc.material.opacity = Math.max(0, ud.opacity);
      if (ud.opacity <= 0) {
        globeGroup.remove(arc);
        arc.geometry.dispose();
        arc.material.dispose();
        arcObjects.splice(i, 1);
      }
    }
  }

  // Animate storage trails
  for (let i = storageTrails.length - 1; i >= 0; i--) {
    const trail = storageTrails[i];
    const ud = trail.userData;
    ud.progress += ud.speed * dt;
    if (ud.phase === 'in') {
      trail.material.opacity = Math.min(ud.progress * 0.6, 0.6);
      if (ud.progress > 2) ud.phase = 'out';
    } else {
      trail.material.opacity -= dt * 0.5;
      if (trail.material.opacity <= 0) {
        globeGroup.remove(trail);
        trail.geometry.dispose();
        trail.material.dispose();
        storageTrails.splice(i, 1);
      }
    }
  }

  // Animate sensor pulses
  for (let i = sensorPulses.length - 1; i >= 0; i--) {
    const pulse = sensorPulses[i];
    const ud = pulse.userData;
    ud.life -= dt * 0.8;
    pulse.material.opacity = Math.max(0, ud.life);

    const posAttr = pulse.geometry.getAttribute('position');
    for (let j = 0; j < ud.velocities.length; j++) {
      posAttr.array[j * 3] += ud.velocities[j].x;
      posAttr.array[j * 3 + 1] += ud.velocities[j].y;
      posAttr.array[j * 3 + 2] += ud.velocities[j].z;
    }
    posAttr.needsUpdate = true;

    if (ud.life <= 0) {
      globeGroup.remove(pulse);
      pulse.geometry.dispose();
      pulse.material.dispose();
      sensorPulses.splice(i, 1);
    }
  }

  // Fire periodic effects
  effectTimer += dt;
  if (effectTimer > 0.4 + Math.random() * 0.6) {
    effectTimer = 0;
    fireRandomEffect();
    // Fire multiple effects per tick for busy network feel
    if (Math.random() < 0.5) fireRandomEffect();
  }

  // Matrix rain
  drawMatrix();

  // Render
  composer.render();
}

// ============================================================
// RESIZE HANDLER
// ============================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  initMatrix();
});

// ============================================================
// MOUSE HOVER — node tooltip
// ============================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('node-tooltip');

renderer.domElement.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  let hit = false;

  for (const node of nodeObjects) {
    const intersects = raycaster.intersectObjects(node.children, true);
    if (intersects.length > 0) {
      const ud = node.userData;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 16) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
      tooltip.querySelector('.tt-name').textContent = ud.name;
      tooltip.querySelector('.tt-roles').textContent = ud.roles.length ? ud.roles.join(', ') : 'node';

      // Find balance from leaderboard
      let bal = '--';
      if (leaderboardData && leaderboardData.leaderboard) {
        const entry = leaderboardData.leaderboard.find(e => e.account === ud.name);
        if (entry && typeof entry.balance === 'number') bal = (entry.balance / 1e10).toFixed(4) + ' BTCPC';
      }
      tooltip.querySelector('.tt-balance').textContent = bal;
      hit = true;
      break;
    }
  }
  if (!hit) tooltip.style.display = 'none';
});

// ============================================================
// INIT
// ============================================================
fetchData();
setInterval(fetchData, 10000);

// Initial events
addEvent('SYNC', 'Globe visualizer initialized');
addEvent('EPOCH', 'Connecting to BTCPC network...');

animate();
</script>
