# BTCPC Docker Compose — Standalone (no clone required)
# Usage:
#   1. Download this file to an empty folder
#   2. Download btcpc-image.tar.gz from btcpc.net to the same folder
#   3. docker load -i btcpc-image.tar.gz
#   4. BTCPC_MINER=yourname docker compose up -d
# Or run btcpc-start.bat from btcpc.net/install which does all of this.
#
# Phase F: MongoDB is optional. By default the btcpc node starts without it
# (BTCPC_MONGO_MODE defaults to "disabled"). Chain state lives on-disk in
# stateStore + blockStore. Auth uses secretStore (file-based).
#
# To re-enable MongoDB for legacy migration:
#   BTCPC_MONGO_MODE=enabled MONGODB_URI=... docker compose --profile legacy up -d
#
# The mongo service only starts when the "legacy" profile is requested:
#   docker compose --profile legacy up -d

services:
  mongo:
    image: mongo:7
    container_name: btcpc-mongo
    restart: unless-stopped
    profiles: [legacy]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama:latest
    container_name: btcpc-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

  btcpc:
    # Load this image locally first:
    #   docker load -i btcpc-image.tar.gz
    # btcpc-start.bat handles this for you automatically.
    image: btcpc:latest
    container_name: btcpc-node
    restart: unless-stopped
    pull_policy: never
    depends_on:
      - ollama
    environment:
      NODE_ENV: production
      PORT: 3000
      # Phase F: MongoDB is disabled by default. Chain state lives in stateStore.
      # Set BTCPC_MONGO_MODE=enabled and provide MONGODB_URI to opt back in.
      BTCPC_MONGO_MODE: ${BTCPC_MONGO_MODE:-disabled}
      MONGODB_URI: ${MONGODB_URI:-}
      OLLAMA_URL: http://ollama:11434
      # JWT_SECRET must be set or the api role will crash-loop.
      # For a personal node you can leave this default. For a public
      # node, generate a fresh secret and set BTCPC_JWT_SECRET in your
      # shell before running docker compose up.
      JWT_SECRET: ${BTCPC_JWT_SECRET:-btcpc-dev-secret-please-override-in-production-ba7c3d}
      JWT_EXPIRES_IN: 7d
      BTCPC_MINER: ${BTCPC_MINER:-}
      BTCPC_MODEL: ${BTCPC_MODEL:-qwen3:4b}
      # Multi-role supervisor: defaults to running every role the node
      # supports (api, miner, clock, storage). Override to a subset
      # like "miner,clock" to save resources, or "api" for an API-only
      # node that doesn't mine.
      BTCPC_ROLES: ${BTCPC_ROLES:-all}
      BTCPC_STORAGE_CAPACITY_GB: ${BTCPC_STORAGE_CAPACITY_GB:-10}
      # Bootstrap peers so a fresh container joins the real BTCPC chain
      # instead of starting a solo fork. The Cloudflare relay is a
      # public, always-on P2P gateway into the live network.
      BTCPC_SEED_PEERS: ${BTCPC_SEED_PEERS:-wss://btcpc-relay.shindevlin.workers.dev/ws}
      BTCPC_RELAY_URL: ${BTCPC_RELAY_URL:-wss://btcpc-relay.shindevlin.workers.dev/ws}
    ports:
      - "3000:3000"    # HTTP API (routes, wallet, commerce, services)
      - "4242:4242"    # Explorer
      - "4243:4243"    # BTCPC-FS storage host HTTP
      - "6942:6942"    # P2P miner
      - "6943:6943"    # P2P clock
    volumes:
      - btcpc_data:/app/data
      - btcpc_blocks:/app/blocks
      - btcpc_blobs:/root/.btcpc/blobs

volumes:
  mongo_data:
  ollama_models:
  btcpc_data:
  btcpc_blocks:
  btcpc_blobs:
