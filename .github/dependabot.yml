# Dependabot config for HONE: security updates only (version-update PRs off).
# Lists the real Cargo workspace roots. Auto-detection treated workspace members
# (rust/hone-node, rust/hone-contract-runtime, rust/hone-market) as projects,
# failed to resolve them, and the grouped job for every directory failed.
# One entry per lockfile, so one broken directory cannot block the others.
version: 2
updates:
- {package-ecosystem: cargo, directory: "/rust", open-pull-requests-limit: 0, schedule: {interval: weekly}, groups: {security: {applies-to: security-updates, patterns: ["*"]}}}
