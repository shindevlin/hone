name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep in step with rust/rust-toolchain.toml.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install RocksDB deps
        run: sudo apt-get install -y librocksdb-dev clang libclang-dev

      # Default features only (matrix off) — this is what nodes ship and what
      # builds on 1.99.1. A PR that doesn't compile fails here and cannot merge.
      - name: cargo check (workspace)
        run: cd rust && cargo check --workspace --all-targets

      - name: cargo test (hone-node)
        run: cd rust && cargo test -p hone-node --bin hone-node -- --test-threads=2
