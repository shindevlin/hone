name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust-check:
    runs-on: [self-hosted, hone]
    # self-hosted runner on grouchly: never run code from a fork there
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # a cold build on the self-hosted runner (rocksdb from source) takes ~20 min
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin to 1.90.0 to match rust/rust-toolchain.toml — rustc 1.93/1.95 hit an
      # ICE on hone-node api module. matrix-sdk (the only thing that forced
      # >=1.93) is behind the off-by-default `matrix` feature. See
      # docs/PLAN_FABLE5_STABILIZATION.md Phase 0.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install RocksDB deps
        run: sudo apt-get update -q && sudo apt-get install -y -q build-essential pkg-config libssl-dev librocksdb-dev clang libclang-dev

      # Default features only (matrix off) — this is what nodes ship and what
      # builds on 1.90. A PR that doesn't compile fails here and cannot merge.
      - name: cargo check (workspace)
        run: cd rust && cargo check --workspace --all-targets

      - name: cargo test (hone-node)
        run: cd rust && cargo test -p hone-node --bin hone-node -- --test-threads=2
