name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --runInBand --forceExit --testTimeout=30000

  rust-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin to 1.90.0 to match rust/rust-toolchain.toml — rustc 1.93/1.95 hit an
      # ICE on btcpc-node's api module. matrix-sdk (the only thing that forced
      # >=1.93) is behind the off-by-default `matrix` feature. See
      # docs/PLAN_FABLE5_STABILIZATION.md Phase 0.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install RocksDB deps
        run: sudo apt-get install -y librocksdb-dev clang libclang-dev

      # Default features only (matrix off) — this is what nodes ship and what
      # builds on 1.90. A PR that doesn't compile fails here and cannot merge.
      - name: cargo check (workspace)
        run: cd rust && cargo check --workspace --all-targets

      - name: cargo test (btcpc-node)
        run: cd rust && cargo test -p btcpc-node --bin btcpc-node -- --test-threads=2
