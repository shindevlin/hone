name: Publish website to gh-pages

# Pages serves the gh-pages branch (legacy build, custom domain honemesh.net).
# This keeps gh-pages in sync with website/ on main, so site changes only need
# one push to main. CNAME lives on gh-pages and is never touched here.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site

      - name: Sync website/ into gh-pages
        run: |
          rsync -a --delete --exclude .git --exclude CNAME website/ _site/
          cd _site
          git add -A
          if git diff --cached --quiet; then echo "gh-pages already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "publish website from ${GITHUB_SHA::7}"
          git push
