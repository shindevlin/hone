name: Release Node Binary

on:
  push:
    tags:
      - 'node-v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add aarch64 target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-node-${{ hashFiles('rust/Cargo.lock') }}

      - name: Build node binaries
        run: |
          cd rust
          cargo build --release -p hone-node
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release -p hone-node --target aarch64-unknown-linux-gnu
          cp target/release/hone-node                              ../hone-node-x86_64-linux
          cp target/aarch64-unknown-linux-gnu/release/hone-node    ../hone-node-aarch64-linux

      - name: Build CLI binaries
        run: |
          cd rust
          cargo build --release -p hone-cli
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release -p hone-cli --target aarch64-unknown-linux-gnu
          cp target/release/hone-cli                              ../hone-x86_64-linux
          cp target/aarch64-unknown-linux-gnu/release/hone-cli    ../hone-aarch64-linux

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hone-node-x86_64-linux
            hone-node-aarch64-linux
            hone-x86_64-linux
            hone-aarch64-linux
