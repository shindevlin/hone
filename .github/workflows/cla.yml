# Copy to .github/workflows/cla.yml in a project licensed under UFL 3.1 or later.
# Records each contributor's agreement to Section 4 of the project's LICENSE
# and fails the pull request's CLAAssistant check until they have signed.
# Make "CLAAssistant" a required status check (see setup.sh).
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only if signatures live in a different repository (see README, "Contributions"):
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          path-to-signatures: 'signatures/cla.json'
          # Signatures are committed here. The branch must exist and must NOT be protected.
          branch: 'cla-signatures'
          # Bots that never sign. Add an automation account only if the person or
          # organization that runs it has signed.
          allowlist: 'dependabot[bot],github-actions[bot]'
