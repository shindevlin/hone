name: OPSEC Audit Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      enforce_gate:
        description: Fail workflow on findings/failures
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      node_version:
        description: Node version for JS audits
        required: false
        default: '20'
        type: string
      rust_toolchain:
        description: Rust toolchain for Rust audits
        required: false
        default: stable
        type: string
      enforce_gate:
        description: Fail workflow on findings/failures
        required: false
        default: false
        type: boolean

env:
  CI: true

permissions:
  contents: read
  security-events: write

jobs:
  js-dependency-audit:
    name: JS Dependency Audit
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('package-lock.json') != '' || hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '20' }}
          cache: npm
      - if: ${{ hashFiles('package-lock.json') != '' || hashFiles('package.json') != '' }}
        run: npm ci
      - if: ${{ hashFiles('package-lock.json') != '' || hashFiles('package.json') != '' }}
        run: npm audit --audit-level=high

  rust-dependency-audit:
    name: Rust Dependency Audit
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - if: ${{ hashFiles('**/Cargo.lock') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_toolchain || 'stable' }}
      - if: ${{ hashFiles('**/Cargo.lock') != '' }}
        run: cargo install cargo-audit --locked
      - if: ${{ hashFiles('**/Cargo.lock') != '' }}
        run: |
          mapfile -t manifests < <(find . -name Cargo.toml -not -path '*/target/*')
          for manifest in "${manifests[@]}"; do
            cargo audit --manifest-path "$manifest"
          done

  secrets-scan:
    name: Secrets Scan (gitleaks)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks with repo config
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest detect \
            --config=/repo/.gitleaks.toml \
            --source=/repo \
            --report-format=sarif \
            --report-path=/repo/gitleaks.sarif \
            --redact

  osv-scan:
    name: OSV Scanner
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            -r
            .

  solidity-static-analysis:
    name: Solidity Static Analysis (Slither)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: solidity
        run: |
          if [ -d contracts ] && find contracts -type f -name '*.sol' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.solidity.outputs.found == 'true'
        uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          fail-on: high

  trivy-fs-scan:
    name: Trivy Filesystem Scan
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run trivy with explicit ignore file
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            aquasec/trivy:0.56.2 fs \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile /repo/.trivyignore \
            --format table \
            /repo

  opsec-summary:
    name: OPSEC Gate Summary
    runs-on: ubuntu-latest
    needs:
      - js-dependency-audit
      - rust-dependency-audit
      - secrets-scan
      - osv-scan
      - solidity-static-analysis
      - trivy-fs-scan
    if: always()
    steps:
      - name: Evaluate gate
        env:
          ENFORCE_GATE: ${{ inputs.enforce_gate || false }}
        run: |
          statuses=(
            "${{ needs.js-dependency-audit.result }}"
            "${{ needs.rust-dependency-audit.result }}"
            "${{ needs.secrets-scan.result }}"
            "${{ needs.osv-scan.result }}"
            "${{ needs.solidity-static-analysis.result }}"
            "${{ needs.trivy-fs-scan.result }}"
          )

          failed=0
          for s in "${statuses[@]}"; do
            if [ "$s" = "failure" ] || [ "$s" = "cancelled" ]; then
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo "OPSEC scanners reported failures/findings."
            if [ "$ENFORCE_GATE" = "true" ]; then
              exit 1
            fi
          fi

          echo "OPSEC run complete (soft mode unless enforce_gate=true)."
