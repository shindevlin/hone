name: hone
version: "1.0.0"
description: Bitcoin Proof of Compute — manage nodes, wallet, and inference earnings
author: Shin Devlin <shindevlin@proton.me>

tools:
  - name: hone_balance
    description: Show HONE token balance for an account
    exec: "node /home/ubuntclaw/repos/hone/bin/hone-cli balance {account}"
    params:
      account:
        type: string
        required: false
        description: HONE account name (defaults to your configured miner)

  - name: hone_status
    description: Show status of all HONE nodes running on this device
    exec: "node /home/ubuntclaw/repos/hone/bin/hone-cli status"

  - name: hone_mine_start
    description: Start the HONE inference miner to earn tokens
    exec: "systemctl --user start hone-miner && systemctl --user status hone-miner --no-pager -l"

  - name: hone_mine_stop
    description: Stop the HONE inference miner
    exec: "systemctl --user stop hone-miner"

  - name: hone_send
    description: Send HONE tokens to another account
    exec: "node /home/ubuntclaw/repos/hone/bin/hone-cli transfer {to} {amount}"
    params:
      to:
        type: string
        required: true
        description: Recipient account name
      amount:
        type: number
        required: true
        description: Amount of HONE to send

  - name: hone_logs
    description: Show recent HONE miner logs
    exec: "journalctl --user -u hone-miner -n 30 --no-pager"

  - name: hone_clock_logs
    description: Show recent HONE clock node logs
    exec: "journalctl --user -u hone-clock -n 30 --no-pager"

  - name: hone_install
    description: Run the HONE node setup wizard
    exec: "node /home/ubuntclaw/repos/hone/bin/hone-install"

  - name: hone_peers
    description: Show connected P2P peers
    exec: "node /home/ubuntclaw/repos/hone/bin/hone-cli peers"

hints:
  - pattern: "hone balance|my balance|how much hone"
    tool: hone_balance
  - pattern: "start mining|start miner|begin mining"
    tool: hone_mine_start
  - pattern: "stop mining|stop miner"
    tool: hone_mine_stop
  - pattern: "send.*hone|transfer hone"
    tool: hone_send
  - pattern: "hone logs|miner logs|mining logs"
    tool: hone_logs
  - pattern: "hone status|node status|is the miner"
    tool: hone_status
