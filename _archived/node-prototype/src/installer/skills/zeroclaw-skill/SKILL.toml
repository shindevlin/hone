[skill]
name = "hone"
version = "1.0.0"
description = "Bitcoin Proof of Compute — manage nodes, wallet, and earnings from your AI assistant"
author = "Shin Devlin <shindevlin@proton.me>"

[[tools]]
name = "hone_balance"
description = "Show HONE token balance"
command = "node /home/ubuntclaw/repos/hone/bin/hone-cli balance"

[[tools]]
name = "hone_status"
description = "Show status of all HONE nodes on this device"
command = "node /home/ubuntclaw/repos/hone/bin/hone-cli status"

[[tools]]
name = "hone_mine_start"
description = "Start the HONE inference miner to earn tokens"
command = "systemctl --user start hone-miner"

[[tools]]
name = "hone_mine_stop"
description = "Stop the HONE inference miner"
command = "systemctl --user stop hone-miner"

[[tools]]
name = "hone_logs"
description = "Show recent HONE miner logs"
command = "journalctl --user -u hone-miner -n 30 --no-pager"

[[tools]]
name = "hone_install"
description = "Run the HONE node setup wizard"
command = "node /home/ubuntclaw/repos/hone/bin/hone-install"
