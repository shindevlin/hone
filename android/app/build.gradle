apply plugin: 'com.android.application'

android {
    namespace = "network.btcpc.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "network.btcpc.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 160
        versionName "3.1.160"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file('../btcpc-release.keystore')
            storePassword 'btcpc_release_2026'
            keyAlias 'btcpc'
            keyPassword 'btcpc_release_2026'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.fragment:fragment:$androidxFragmentVersion"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

// Build the Rust miner .so via cargo-ndk (requires cargo-ndk + Rust toolchain with NDK targets).
// Run: cargo install cargo-ndk
//      rustup target add aarch64-linux-android x86_64-linux-android
// The task is skipped entirely if cargo-ndk is not on PATH — MinerService detects the missing
// library at runtime and shows a "rebuild with cargo-ndk" message instead of crashing.
task buildRustMiner {
    doLast {
        // Resolve cargo-ndk: prefer ~/.cargo/bin (cargo install location),
        // fall back to system PATH. Use shell expansion so $HOME is always correct.
        def resolveProc = ['sh', '-c',
            'test -f "$HOME/.cargo/bin/cargo-ndk" && echo "$HOME/.cargo/bin/cargo-ndk" || which cargo-ndk 2>/dev/null'
        ].execute()
        resolveProc.waitFor()
        def cargoNdk = resolveProc.text?.trim()
        if (!cargoNdk) {
            logger.lifecycle('[btcpc] cargo-ndk not found — skipping Rust miner build (install with: cargo install cargo-ndk)')
            return
        }

        def rustDir = file('../rust/btcpc-miner').canonicalPath
        def jniOut  = file('src/main/jniLibs').canonicalPath
        // Export PATH with ~/.cargo/bin so cargo/rustup tools resolve inside the build
        def cmd = 'export PATH="$HOME/.cargo/bin:$PATH" && cargo ndk -t arm64-v8a -t x86_64 -o \'' + jniOut + '\' build --release'
        def proc = ['sh', '-c', 'cd \'' + rustDir + '\' && ' + cmd].execute()
        proc.consumeProcessOutput(System.out, System.err)
        proc.waitFor()
        if (proc.exitValue() != 0) {
            logger.lifecycle('[btcpc] Rust miner build failed — mining will show library-missing message on device')
        }
    }
}

tasks.whenTaskAdded { task ->
    if (task.name == 'mergeDebugJniLibFolders' || task.name == 'mergeReleaseJniLibFolders') {
        task.dependsOn buildRustMiner
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
