[package]
name = "btcpc-miner"
version = "0.1.0"
edition = "2021"

[lib]
name = "btcpc_miner"
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.21", features = ["invocation"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
candle-core = { git = "https://github.com/huggingface/candle", branch = "main" }
candle-transformers = { git = "https://github.com/huggingface/candle", branch = "main" }
candle-nn = { git = "https://github.com/huggingface/candle", branch = "main" }
hf-hub = { version = "0.3", features = ["tokio"] }
tokenizers = { version = "0.19", default-features = false, features = ["http"] }
log = "0.4"
android_logger = "0.13"
once_cell = "1"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
