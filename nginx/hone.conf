upstream hone_node   { server hone-node:3000; }
upstream hone_market { server hone-market:7042; }

server {
    listen 80;
    server_name _;

    # ── Commerce sidecar ────────────────────────────────────────────────────
    location /api/commerce/ {
        proxy_pass         http://hone_market;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Block explorer (WebSocket-capable) ──────────────────────────────────
    location /explorer/ {
        proxy_pass             http://hone_node;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
    }

    # ── HONE node — everything else (API + P2P WebSocket upgrade) ─────────
    location / {
        proxy_pass             http://hone_node;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        "upgrade";
        proxy_read_timeout     120s;
    }
}
